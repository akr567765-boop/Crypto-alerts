<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Modal Fixed</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#07090e;
      color:white;
      font-family:Arial,sans-serif;
      min-height:100vh;
      padding:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    button{
      background:#00ff88;
      color:#000;
      padding:16px 24px;
      font-size:18px;
      border:none;
      border-radius:14px;
      cursor:pointer;
      transition:0.25s;
      font-weight:bold;
    }

    button:hover{
      transform:scale(1.05);
      opacity:0.9;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.75);
      z-index:1000;
      align-items:center;
      justify-content:center;
      padding:20px;
      backdrop-filter:blur(6px);
    }

    .modal.active{
      display:flex;
    }

    .modal-content{
      background:#111827;
      width:100%;
      max-width:420px;
      padding:28px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
      animation:popup 0.25s ease;
    }

    @keyframes popup{
      from{
        transform:translateY(20px) scale(0.95);
        opacity:0;
      }
      to{
        transform:translateY(0) scale(1);
        opacity:1;
      }
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:20px;
    }

    .close-btn{
      width:40px;
      height:40px;
      border-radius:50%;
      padding:0;
      font-size:20px;
      background:#ff4d6d;
      color:white;
    }

    .form-group{
      margin-bottom:16px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      color:#9ca3af;
    }

    input{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:14px;
      background:#1f2937;
      color:white;
      font-size:16px;
      border:1px solid transparent;
      transition:0.2s;
    }

    input:focus{
      border-color:#00ff88;
      box-shadow:0 0 0 3px rgba(0,255,136,0.15);
    }

    .create-btn{
      width:100%;
      margin-top:10px;
    }

    .status{
      margin-top:15px;
      font-size:14px;
      color:#00ff88;
      text-align:center;
    }
  </style>
</head>

<body>

  <h1>Test Page - Fixed Modal & Buttons</h1>

  <button id="testBtn">CLICK ME - TEST BUTTON</button>

  <button id="openModalBtn">OPEN MODAL</button>

  <div id="myModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Create Alert</h2>
        <button class="close-btn" id="closeModalBtn">×</button>
      </div>

      <div class="form-group">
        <label>Coin Symbol</label>
        <input type="text" id="coinInput" placeholder="BTCUSDT">
      </div>

      <div class="form-group">
        <label>Target Price</label>
        <input type="number" id="priceInput" placeholder="65000">
      </div>

      <button class="create-btn" id="createAlertBtn">
        Create Alert
      </button>

      <div class="status" id="statusText"></div>

    </div>

  </div>

  <script>
    const modal = document.getElementById('myModal');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const testBtn = document.getElementById('testBtn');
    const createBtn = document.getElementById('createAlertBtn');

    const coinInput = document.getElementById('coinInput');
    const priceInput = document.getElementById('priceInput');
    const statusText = document.getElementById('statusText');

    // TEST BUTTON
    testBtn.addEventListener('click', () => {
      alert('✅ Button clicked! JavaScript works!');
    });

    // OPEN MODAL
    openBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });

    // CLOSE MODAL
    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // CLOSE WHEN CLICK OUTSIDE
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });

    // ESC KEY CLOSE
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        modal.classList.remove('active');
      }
    });

    // CREATE ALERT
    createBtn.addEventListener('click', () => {

      const coin = coinInput.value.trim();
      const price = priceInput.value.trim();

      if (!coin || !price) {
        statusText.innerHTML = '❌ Please fill all fields';
        return;
      }

      statusText.innerHTML =
        `✅ Alert Created: ${coin.toUpperCase()} at $${price}`;

      console.log({
        coin: coin.toUpperCase(),
        targetPrice: price
      });

      // CLEAR INPUTS
      coinInput.value = '';
      priceInput.value = '';

      // AUTO CLOSE
      setTimeout(() => {
        modal.classList.remove('active');
        statusText.innerHTML = '';
      }, 1500);
    });

  </script>

</body>
</html>
