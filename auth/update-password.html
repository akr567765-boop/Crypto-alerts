<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - CryptoFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0A0C10 0%, #1a1f2e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(18, 22, 28, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      border: 1px solid rgba(46, 204, 113, 0.2);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo svg { width: 56px; height: 56px; }
    .logo h1 { color: #2ecc71; margin-top: 12px; font-size: 28px; }
    h3 { color: white; margin-bottom: 24px; text-align: center; }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(46,204,113,0.3);
      border-radius: 16px;
      color: white;
      font-size: 16px;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #2ecc71; }
    button {
      width: 100%;
      padding: 14px;
      background: #2ecc71;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .message { margin-top: 16px; padding: 12px; border-radius: 12px; display: none; text-align: center; }
    .error { background: rgba(231,76,60,0.15); color: #e74c3c; }
    .success { background: rgba(46,204,113,0.15); color: #2ecc71; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 4L4 12L16 20L28 12L16 4Z" stroke="#2ecc71" stroke-width="1.5" fill="none"/>
        <circle cx="16" cy="16" r="2" fill="#2ecc71"/>
      </svg>
      <h1>CryptoFlow</h1>
    </div>
    <h3>Create New Password</h3>
    <input type="password" id="newPassword" placeholder="New password (min 6 characters)">
    <input type="password" id="confirmPassword" placeholder="Confirm new password">
    <button onclick="updatePassword()">Update Password</button>
    <div id="message" class="message"></div>
  </div>
  <script>
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    let accessToken = hashParams.get('access_token');
    
    if (!accessToken) {
      document.getElementById('message').textContent = 'Invalid or expired reset link';
      document.getElementById('message').className = 'message error';
      document.getElementById('message').style.display = 'block';
    }
    
    async function updatePassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }
      
      try {
        const response = await fetch('/api/auth/update-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: accessToken, new_password: newPassword })
        });
        const data = await response.json();
        if (data.error) {
          showMessage(data.error, 'error');
        } else {
          showMessage('Password updated! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 2000);
        }
      } catch (error) {
        showMessage('Network error', 'error');
      }
    }
    
    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = `message ${type}`;
      msgDiv.style.display = 'block';
    }
  </script>
</body>
</html>
