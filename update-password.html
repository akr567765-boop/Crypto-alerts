<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - CryptoFlow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0A0C10 0%, #1a1f2e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(18, 22, 28, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      border: 1px solid rgba(46, 204, 113, 0.2);
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .logo svg {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 0 10px rgba(46, 204, 113, 0.3));
    }
    
    .logo h1 {
      color: #2ecc71;
      margin-top: 12px;
      font-size: 28px;
      font-weight: 700;
    }
    
    .logo p {
      color: #888;
      font-size: 14px;
      margin-top: 8px;
    }
    
    h3 {
      color: white;
      margin-bottom: 24px;
      text-align: center;
      font-size: 20px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    .input-group label {
      display: block;
      color: #aaa;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(46, 204, 113, 0.3);
      border-radius: 16px;
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    input:focus {
      outline: none;
      border-color: #2ecc71;
      background: rgba(255, 255, 255, 0.08);
    }
    
    input::placeholder {
      color: #666;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: #2ecc71;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background: #27ae60;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
    }
    
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      text-align: center;
    }
    
    .error {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #e74c3c;
    }
    
    .success {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
    }
    
    .info {
      background: rgba(52, 152, 219, 0.15);
      border: 1px solid rgba(52, 152, 219, 0.3);
      color: #3498db;
    }
    
    .requirements {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      padding-left: 8px;
    }
    
    .requirements ul {
      margin-top: 4px;
      padding-left: 20px;
    }
    
    .requirements li {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 4L4 12L16 20L28 12L16 4Z" stroke="#2ecc71" stroke-width="1.5" fill="none"/>
        <path d="M4 20L16 28L28 20" stroke="#2ecc71" stroke-width="1.5" fill="none"/>
        <circle cx="16" cy="16" r="2" fill="#2ecc71"/>
        <path d="M16 8L10 12L16 16L22 12L16 8Z" fill="#2ecc71" fill-opacity="0.3"/>
      </svg>
      <h1>CryptoFlow</h1>
      <p>Reset Your Password</p>
    </div>
    
    <h3>Create New Password</h3>
    
    <div class="input-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password">
    </div>
    
    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm your new password">
    </div>
    
    <div class="requirements">
      Password requirements:
      <ul>
        <li>Minimum 6 characters</li>
        <li>Can include letters, numbers, and symbols</li>
      </ul>
    </div>
    
    <button onclick="updatePassword()">Update Password</button>
    
    <div id="message" class="message"></div>
  </div>
  
  <script>
    // Get the access token from URL hash
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    let accessToken = hashParams.get('access_token');
    
    // Also try to get from URL parameters (some providers use different format)
    const urlParams = new URLSearchParams(window.location.search);
    if (!accessToken) {
      accessToken = urlParams.get('access_token');
    }
    
    console.log('Access token found:', accessToken ? 'Yes' : 'No');
    
    if (!accessToken) {
      showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
      // Redirect to login after 3 seconds
      setTimeout(() => {
        window.location.href = '/';
      }, 3000);
    }
    
    async function updatePassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Validate password
      if (!newPassword || !confirmPassword) {
        showMessage('Please fill in both password fields', 'error');
        return;
      }
      
      if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters long', 'error');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match. Please try again.', 'error');
        return;
      }
      
      showMessage('Updating password...', 'info');
      
      try {
        const response = await fetch('/api/auth/update-password', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            access_token: accessToken,
            new_password: newPassword 
          })
        });
        
        const data = await response.json();
        
        if (data.error) {
          showMessage(data.error, 'error');
        } else if (data.success) {
          showMessage('✅ Password updated successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          showMessage('Something went wrong. Please try again.', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showMessage('Network error: ' + error.message, 'error');
      }
    }
    
    function showMessage(msg, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.className = `message ${type}`;
      msgDiv.style.display = 'block';
      
      // Auto-hide after 5 seconds for non-info messages
      if (type !== 'info') {
        setTimeout(() => {
          if (msgDiv.style.display === 'block') {
            msgDiv.style.display = 'none';
          }
        }, 5000);
      }
    }
    
    // Allow pressing Enter to submit
    document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        updatePassword();
      }
    });
    
    document.getElementById('newPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('confirmPassword').focus();
      }
    });
  </script>
</body>
</html>
